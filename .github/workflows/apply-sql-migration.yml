name: Apply SQL migration (Management API)

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file under the repo'
        required: true
        default: 'supabase/ops/apply_seo_monthly_shares.sql'
      migration_name:
        description: 'Migration name recorded in Supabase'
        required: true
        default: 'apply_seo_monthly_shares'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sql-migration.yml'
      - 'supabase/ops/apply_seo_monthly_shares.sql'
      - 'supabase/ops/fix_cross_tenant_client_task_updates.sql'

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: zvoijyneresvkadpprel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve SQL file
        id: sql
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ github.event.inputs.sql_file }}"
            NAME="${{ github.event.inputs.migration_name }}"
          else
            # Prefer the newest ops migration that triggered this push.
            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- \
                'supabase/ops/fix_cross_tenant_client_task_updates.sql' | grep -q .; then
              FILE="supabase/ops/fix_cross_tenant_client_task_updates.sql"
              NAME="fix_cross_tenant_client_task_updates"
            else
              FILE="supabase/ops/apply_seo_monthly_shares.sql"
              NAME="apply_seo_monthly_shares"
            fi
          fi
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Apply via /database/migrations
        run: |
          set -euo pipefail
          FILE="${{ steps.sql.outputs.file }}"
          NAME="${{ steps.sql.outputs.name }}"
          python3 - <<'PY'
          import json, os, pathlib, sys, time, urllib.error, urllib.request

          path = os.environ["SQL_FILE"]
          name = os.environ["MIG_NAME"]
          query = pathlib.Path(path).read_text()
          body = json.dumps({"query": query, "name": name}).encode()
          url = f"https://api.supabase.com/v1/projects/{os.environ['PROJECT_REF']}/database/migrations"
          headers = {
              "Authorization": f"Bearer {os.environ['SUPABASE_ACCESS_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "aios-apply-sql-migration/1.0",
              "Accept": "application/json",
          }

          last_err = None
          for attempt in range(1, 6):
              req = urllib.request.Request(url, data=body, headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=180) as resp:
                      raw = resp.read().decode()
                      print(f"HTTP {resp.status} attempt={attempt}")
                      print(raw[:4000])
                      sys.exit(0)
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  print(f"HTTP {e.code} attempt={attempt}", file=sys.stderr)
                  print(raw[:4000], file=sys.stderr)
                  last_err = e
                  if e.code in (403, 429, 500, 502, 503, 504) and attempt < 5:
                      time.sleep(60)
                      continue
                  sys.exit(1)
              except Exception as e:
                  print(f"error attempt={attempt}: {e}", file=sys.stderr)
                  last_err = e
                  if attempt < 5:
                      time.sleep(60)
                      continue
                  sys.exit(1)
          raise SystemExit(str(last_err))
          PY
        env:
          SQL_FILE: ${{ steps.sql.outputs.file }}
          MIG_NAME: ${{ steps.sql.outputs.name }}
