name: Apply SQL migration (Management API)

# Manual or auto: run SQL against prod via Supabase CLI (`db query --linked`).
# Requires repo secret BASE_ACCESS_TOKEN (sbp_...).

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: 'Path to SQL file under the repo'
        required: true
        default: 'supabase/ops/apply_seo_monthly_shares.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sql-migration.yml'
      - 'supabase/ops/apply_seo_monthly_shares.sql'

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
      PROJECT_REF: zvoijyneresvkadpprel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve SQL file
        id: sql
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ github.event.inputs.sql_file }}"
          else
            FILE="supabase/ops/apply_seo_monthly_shares.sql"
          fi
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply SQL
        run: |
          set -euo pipefail
          FILE="${{ steps.sql.outputs.file }}"
          echo "Applying $FILE"
          attempt=1
          until supabase db query --linked -f "$FILE"; do
            if [ "$attempt" -ge 5 ]; then
              echo "Giving up after $attempt attempts"
              exit 1
            fi
            echo "Attempt $attempt failed — waiting 60s (Supabase API flaky)"
            attempt=$((attempt + 1))
            sleep 60
          done
          echo "Verifying table exists..."
          supabase db query --linked "select to_regclass('public.seo_monthly_shares') as table_regclass;"
