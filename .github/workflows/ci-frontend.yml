name: CI — frontend build

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  pull_request:
    branches: [main, develop]
  # Baseline additions are allowed only after approval of the current PR head.
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main, develop]

concurrency:
  group: ci-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request_review' || contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript gate regression tests
        run: pnpm test:typecheck

      - name: Full frontend TypeScript gate
        run: pnpm typecheck

      - name: Require maintainer review for TypeScript baseline additions
        if: github.event.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const { baselineAdditions, approvingMaintainer } = await import(pathToFileURL(`${process.cwd()}/scripts/typecheck.mjs`).href);
            const current = JSON.parse(fs.readFileSync('scripts/typecheck-baseline.json', 'utf8'));
            const pr = context.payload.pull_request;
            let previous = null;
            try {
              const { data } = await github.rest.repos.getContent({
                ...context.repo, path: 'scripts/typecheck-baseline.json', ref: pr.base.sha,
                mediaType: { format: 'raw' },
              });
              previous = JSON.parse(typeof data === 'string' ? data : Buffer.from(data.content, 'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (!baselineAdditions(current, previous)) return;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              ...context.repo, pull_number: pr.number,
            });
            const approver = await approvingMaintainer(reviews, pr.head.sha, async username => {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo, username,
              });
              return data.permission;
            });
            if (approver) {
              core.info(`TypeScript baseline additions approved by ${approver} at ${pr.head.sha}.`);
              return;
            }
            core.setFailed('TypeScript baseline additions or compiler changes require maintainer approval of the current PR head. Review the diagnostic diff, then approve the PR; approval reruns this check.');

      - name: Regression guards (dashboards + permission personas)
        run: pnpm test:guards
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.BASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}

      - name: Environment and report regression tests
        run: node --test scripts/edge-deploy-plan.test.mjs scripts/deploy-edge.test.mjs supabase/functions/_shared/staging-outbound.test.mjs supabase/functions/_shared/meeting-summary-prompts.test.ts supabase/functions/_shared/signature-field-text.test.ts supabase/functions/_shared/signature-email-template.test.ts supabase/functions/_shared/report-sync-window.test.ts src/lib/carmenLoaderSignal.test.ts src/lib/clipboardFiles.test.ts src/lib/reportRecords.test.ts src/lib/reportCoverage.test.ts src/lib/reportSyncCadence.test.ts src/lib/dashboardDateFilters.test.ts src/lib/weeklyAdsComparison.test.ts src/lib/adAccountUrl.test.ts src/lib/gaPropertyMatch.test.ts supabase/functions/_shared/gaDomain.test.ts src/lib/leadTableLayout.test.ts src/lib/leadTableColumns.test.ts src/lib/leadViewMode.test.ts src/lib/recordingSummaryTarget.test.ts src/lib/sharedReportTabs.test.ts src/lib/signatureFieldGuide.test.ts src/lib/signatureDate.test.ts src/lib/teamMemberMatch.test.ts

      - name: Mirror contract tests
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror.py'

      - name: Carmen pulse regression tests
        run: node --experimental-strip-types --test supabase/functions/_shared/pulse-foundation.test.mjs supabase/functions/_shared/client-retention.test.ts supabase/functions/_shared/agent-channel/whatsapp-direct.test.ts supabase/functions/_shared/carmen-direct-tools.test.mjs

      - name: Build frontend
        run: pnpm build

  mirror-sql:
    if: github.event_name != 'pull_request_review' || contains(fromJSON('["main", "develop"]'), github.event.pull_request.base.ref)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mirror_test
          POSTGRES_USER: mirror_test
          POSTGRES_PASSWORD: disposable_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - name: Verify mirror transactions on disposable PostgreSQL
        env:
          MIRROR_TEST_DSN: postgresql://mirror_test:disposable_test_only@localhost:5432/mirror_test
        run: python3 -m unittest discover -s scripts -p 'test_staging_mirror_postgres.py'
