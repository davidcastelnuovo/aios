# Auto-merge qualifying safe bugfix PRs directly to main.
# Add label `safe-bugfix` on PRs to main from fix/* or cursor/fix-* branches.
#
# Rules (all required):
#   - label safe-bugfix
#   - base: main, head: fix/* | cursor/fix-* | cursor/*-fix-*
#   - ≤ 8 files, ≤ 400 line delta
#   - no supabase/migrations, supabase/ops, or .github/workflows changes
#   - CI — frontend build succeeded on PR head

name: Auto-merge safe bugfix to main

on:
  workflow_run:
    workflows: ["CI — frontend build"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const headBranch = context.payload.workflow_run.head_branch;

            const branchOk = /^(fix\/|cursor\/fix-|cursor\/.+-fix-)/.test(headBranch);
            if (!branchOk) {
              core.info(`Skip: branch ${headBranch} is not a fix branch`);
              return;
            }

            const prs = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${headBranch}`,
            });
            const pr = prs.data.find(p => p.base.ref === 'main');
            if (!pr) {
              core.info('Skip: no open PR to main for this branch');
              return;
            }

            const labels = pr.labels.map(l => l.name);
            if (!labels.includes('safe-bugfix')) {
              core.info('Skip: PR missing safe-bugfix label');
              return;
            }

            const total = pr.additions + pr.deletions;
            if (pr.changed_files > 8 || total > 400) {
              core.setFailed(`Skip: diff too large (${pr.changed_files} files, ${total} lines)`);
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const blocked = files.some(f =>
              f.filename.startsWith('supabase/migrations/') ||
              f.filename.startsWith('supabase/ops/') ||
              f.filename.startsWith('.github/workflows/')
            );
            if (blocked) {
              core.info('Skip: PR touches blocked paths');
              return;
            }

            if (pr.head.sha !== headSha) {
              core.info('Skip: workflow SHA does not match PR head (stale run)');
              return;
            }

            await github.rest.pulls.merge({
              owner, repo, pull_number: pr.number, merge_method: 'squash',
            });
            core.info(`Merged PR #${pr.number} (${headBranch}) to main`);
