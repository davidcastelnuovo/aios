    --ink: #1c2a38;

  .danny-pik-vcard *,
  .danny-pik-vcard *::before,
  .danny-pik-vcard *::after {
    box-sizing: border-box;
  }

  .danny-pik-vcard__scene {
    width: 100%;
  }

  .danny-pik-vcard .biz-card {
    position: relative;
    overflow: hidden;
    width: 100%;
    aspect-ratio: 1671 / 941;
    min-height: 260px;
    border-radius: var(--card-radius);
    background-color: #f3eee6;
    background-image: var(--card-bg-url);
    background-size: cover;
    background-position: center right;
    background-repeat: no-repeat;
    box-shadow:
      0 28px 60px rgba(28, 42, 56, 0.14),
      0 2px 0 rgba(255, 255, 255, 0.65) inset;
  }

  .danny-pik-vcard .biz-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.12) 0%, transparent 38%);
    z-index: 0;
  }

  .danny-pik-vcard .biz-card::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.45);
    border-radius: inherit;
    z-index: 0;
  }

  .danny-pik-vcard .biz-card__content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 58%;
    height: 100%;
    min-height: 260px;
    padding: 36px 32px 32px 28px;
  }

  .danny-pik-vcard .name-block h1 {
    margin: 0;
    font-size: clamp(1.85rem, 5vw, 2.35rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .danny-pik-vcard .gold-line {
    width: 72px;
    height: 2px;
    margin: 14px 0 12px;
    border: none;
    background: linear-gradient(90deg, var(--gold), rgba(196, 165, 116, 0.35));
    border-radius: 2px;
  }

  .danny-pik-vcard .name-en {
    margin: 0 0 28px;
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.28em;
    color: var(--ink-muted);
    direction: ltr;
    text-align: right;

    margin: 0;

<script>
(function () {
  var VCARD =
    "BEGIN:VCARD\r\n" +
    "VERSION:3.0\r\n" +
    "FN;CHARSET=UTF-8:דני פיק\r\n" +
    "N;CHARSET=UTF-8:פיק;דני;;;\r\n" +
    "ORG;CHARSET=UTF-8:פ.ד. נכסים\r\n" +
    "TEL;TYPE=CELL,VOICE:052-375155\r\n" +
    "EMAIL;TYPE=INTERNET:danny@pdpsagot.co.il\r\n" +
    "URL:https://www.pdpsagot.co.il\r\n" +
    "END:VCARD\r\n";

  function downloadVcard() {
    var blob = new Blob([VCARD], { type: "text/vcard;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "danny-pik.vcf";
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  var root = document.querySelector(".danny-pik-vcard");
  if (!root) return;
  var btn = root.querySelector("[data-vcard-download]");
  if (!btn) return;
  btn.addEventListener("click", function (event) {
    event.preventDefault();
    downloadVcard();
  });
})();
</script>
